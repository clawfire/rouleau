# Netlify build. Needs one environment variable: WEBAWESOME_TOKEN (Web Awesome Pro token,
# Site configuration › Environment variables, mark it as secret).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Installs run before the build command, so point npm at a committed config that
  # reads the token from the environment (the real .npmrc is git-ignored).
  NPM_CONFIG_USERCONFIG = ".npmrc.netlify"
  # Use the /hevy and /gcal rewrites below instead of calling the APIs from the browser (CORS).
  VITE_USE_PROXY = "1"

# `npm run dev` (netlify dev): Vite on 5173, served with the redirects below on http://localhost:8888.
[dev]
  command = "vite --port 5173 --strictPort"
  targetPort = 5173
  autoLaunch = false

# Same role as the Vite dev proxy: Hevy and Google Calendar send no CORS headers.
[[redirects]]
  from = "/hevy/*"
  to = "https://api.hevyapp.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/gcal/*"
  to = "https://calendar.google.com/:splat"
  status = 200
  force = true

# Security headers. A Content-Security-Policy is still to do (see NEXT.md): it has to list the
# third parties the page talks to (theme fonts, icons, Open-Meteo) and the form captcha.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), bluetooth=(self), camera=(), microphone=(), payment=(), usb=(), serial=()"

# Vite fingerprints everything in /assets: cache it for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
